<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dr.Docs</title>
    <script>
      try {
        var t = localStorage.getItem("dr-docs-theme");
        if (t === "white" || t === "amoled" || t === "midnight") document.documentElement.setAttribute("data-theme", t);
        else document.documentElement.setAttribute("data-theme", "midnight");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "midnight");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
